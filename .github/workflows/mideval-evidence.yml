name: MidEval evidence checks

concurrency:
  group: mideval-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'gpt/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: code

jobs:
  evidence:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Execute portable validation, preview, plan and localhost integration
        run: python -B scripts/run_mid1_ci.py --job evidence --output artifacts/ci_evidence/evidence
      - name: Keep the generated evidence for review
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mid-eval-evidence-${{ matrix.os }}
          path: code/artifacts/ci_evidence/evidence/
          if-no-files-found: warn
          retention-days: 14

  streamlit-ui:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: Install the historical demo runtime
        run: python -B -m pip install -r requirements-demo-runtime.txt
      - name: Install the pinned source checker
        run: python -B -m pip install -r requirements-quality.txt
      - name: Execute source checks and all current recorded UI scopes
        run: python -B scripts/run_mid1_ci.py --job streamlit-ui --output artifacts/ci_evidence/streamlit-ui
      - name: Keep UI logs and their source-bound receipt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mid-eval-ui-${{ matrix.os }}
          path: code/artifacts/ci_evidence/streamlit-ui/
          if-no-files-found: warn
          retention-days: 14

# This job covers the artifact-backed explanation increment. The full training
# suite needs its pinned environment and acquired datasets. Deployment/delivery
# publication is pending a chosen target and repository access; this workflow
# does not claim a running CD deployment or evaluation of a language model.
