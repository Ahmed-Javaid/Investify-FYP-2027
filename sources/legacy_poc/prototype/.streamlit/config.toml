# Projector-safe theme.
#
# Lecture-room projectors wash out dark backgrounds badly: a dark UI that looks
# sharp on a laptop turns into grey mud on a screen, and low-saturation accent
# colours stop being distinguishable from each other entirely. So this forces a
# light background with near-black text and high-contrast accents, rather than
# leaving the theme to follow whatever the presenting laptop happens to be set
# to.
#
# Do not remove this file before the defence. Without it Streamlit inherits the
# OS setting, and if the presenting laptop is in dark mode the whole prototype
# renders dark on the projector.

[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF2F7"
textColor = "#101418"
primaryColor = "#0B5FBF"
font = "sans serif"

[browser]
gatherUsageStats = false
